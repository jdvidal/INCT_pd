<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flora — 100 Artenkenntnis</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#3c3c3c;--mut:#777;--line:#e5e5e5;--g:#58cc02;--gd:#58a700;--b:#1cb0f6;--bd:#1899d6;--r:#ff4b4b;--rd:#ea2b2b;--y:#ffc800;--yd:#e5b400;--okbg:#d7ffb8;--okink:#46a302;--badbg:#ffdfe0;--badink:#d33131;--sel:#ddf4ff;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#131f24;--ink:#e8eef0;--mut:#8fa3ad;--line:#37464f;--okbg:#1d3a0d;--okink:#8be04a;--badbg:#3d1618;--badink:#ff8a8a;--sel:#1a3a4a;--card:#1b2a31}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Varela Round",ui-rounded,system-ui,sans-serif;font-weight:700}
.view{display:none;max-width:560px;margin:0 auto}.view.on{display:block}
button{font:inherit;color:inherit}
.btn{border:0;border-radius:16px;padding:15px 20px;color:#fff;background:var(--g);box-shadow:0 4px 0 var(--gd);cursor:pointer;width:100%;font-weight:900;font-size:1rem;letter-spacing:.06em;text-transform:uppercase}
.btn:active{transform:translateY(4px);box-shadow:none}.btn.red{background:var(--r);box-shadow:0 4px 0 var(--rd)}.btn.blue{background:var(--b);box-shadow:0 4px 0 var(--bd)}
.btn:disabled{background:var(--line);color:var(--mut);box-shadow:none;cursor:default;transform:none}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-around;padding:12px 10px;border-bottom:2px solid var(--line);font-weight:900;font-size:1.1rem}
.top span:nth-child(1){color:#ff9600}.top span:nth-child(2){color:var(--yd)}.top span:nth-child(3){color:var(--gd)}
.pad{padding:16px 18px}.h1{font-size:1.6rem;font-weight:900;margin:6px 0 2px}.sub{color:var(--mut);margin:0 0 14px}
.rev{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;background:var(--card);padding:14px;cursor:pointer}
.rev:disabled{opacity:.55;cursor:default}.rev b{display:block;font-size:1.1rem;color:var(--b)}.rev small{color:var(--mut);font-weight:700}.rev .ic{font-size:2rem}
.path{display:flex;flex-direction:column;align-items:center;gap:26px;padding:26px 0 120px}
.nodew{display:flex;flex-direction:column;align-items:center;position:relative}
.node{width:88px;height:88px;border-radius:50%;border:0;padding:0;cursor:pointer;background:conic-gradient(var(--g) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.node i{width:70px;height:70px;border-radius:50%;background:var(--g);box-shadow:0 6px 0 var(--gd);display:grid;place-items:center;font-style:normal;color:#fff;font-size:1.7rem;font-weight:900}
.node.gold i{background:var(--y);box-shadow:0 6px 0 var(--yd)}.node:active i{transform:translateY(5px);box-shadow:none}
.nl{margin-top:12px;font-size:.85rem;color:var(--mut);text-align:center;max-width:170px}
.go{position:absolute;top:-34px;background:var(--card);color:var(--gd);border:2px solid var(--line);border-radius:12px;padding:3px 10px;font-weight:900;font-size:.85rem;animation:fl 1.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-5px)}}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.nav div{max-width:560px;margin:auto;display:flex}.nav button{flex:1;background:none;border:0;padding:10px;font-weight:900;color:var(--mut);cursor:pointer;font-size:.95rem}.nav button.on{color:var(--b)}.nav span{display:block;font-size:1.5rem}
#lesson.on{display:flex;flex-direction:column;height:100dvh}
.lh{display:flex;align-items:center;gap:14px;padding:16px}.x{background:none;border:0;font-size:1.6rem;color:var(--mut);cursor:pointer}
.bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}.bar b{display:block;height:100%;width:0;background:var(--g);border-radius:99px;transition:width .35s;position:relative}
.bar b:after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:9px;background:#fff6}
.hp{color:var(--r);font-weight:900;font-size:1.15rem}
.qa{flex:1;overflow:auto;padding:6px 18px 20px;display:flex;flex-direction:column;gap:16px}
.q{font-size:1.45rem;font-weight:900}.big{font-size:1.5rem;font-weight:900;border:2px solid var(--line);border-radius:18px;padding:16px;background:var(--card)}.big small{display:block;color:var(--mut);font-size:1rem;margin-top:4px}
.big.sci,.big em{font-style:italic}.bubble{border:2px solid var(--line);border-radius:18px;padding:16px;font-weight:700;line-height:1.5;background:var(--card)}
.pic{height:220px;border:2px solid var(--line);border-radius:18px;display:grid;place-items:center;overflow:hidden;background:var(--card);font-size:2.4rem}.pic img{width:100%;height:100%;object-fit:contain}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font-size:1.1rem;font-weight:800;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:13px 14px;cursor:pointer}
.opt kbd{font:inherit;font-size:.85rem;border:2px solid var(--line);border-radius:8px;min-width:28px;height:28px;display:grid;place-items:center;color:var(--mut)}
.opt.i span{font-style:italic}.opt.sel{border-color:var(--b);background:var(--sel);color:var(--b)}.opt.sel kbd{border-color:var(--b);color:var(--b)}
.opt.ok{border-color:var(--g);background:var(--okbg);color:var(--okink)}.opt.bad{border-color:var(--r);background:var(--badbg);color:var(--badink)}
.lf{padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:2px solid var(--line);max-height:58dvh;overflow:auto}
.lf.ok{background:var(--okbg);border-color:transparent;color:var(--okink)}.lf.bad{background:var(--badbg);border-color:transparent;color:var(--badink)}
.lf .btn{margin-top:12px}.fbh{font-weight:900;font-size:1.1rem}
.lf .sci{font-size:2rem;font-weight:900;font-style:italic;line-height:1.15;margin:4px 0;animation:pop .45s}
.lf .fam{display:inline-flex;align-items:center;gap:8px;background:var(--gd);color:#fff;border-radius:99px;padding:6px 16px;font-weight:900;font-size:1.15rem;margin:6px 0 10px;animation:pop .45s .08s both}
.lf.bad .fam{background:var(--rd)}.fam small{font-size:.75rem;font-weight:800;opacity:.85}
.nm,.tip,.lf details{font-size:.98rem;line-height:1.5}.lf details{margin-top:6px}.lf summary{cursor:pointer;font-weight:900}.lf p{margin:6px 0}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.tile{border:2px solid;border-radius:16px;padding:10px 4px;text-align:center;font-weight:900}.tile small{display:block;font-size:.72rem;margin-bottom:4px;letter-spacing:.05em}
.t1{border-color:var(--yd);color:var(--yd)}.t2{border-color:var(--b);color:var(--b)}.t3{border-color:var(--g);color:var(--gd)}
.rs{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:2px solid var(--line)}.rs i{font-weight:900}.rs span{color:var(--gd);font-weight:800;font-size:.9rem}
#search{width:100%;font:inherit;font-weight:700;padding:13px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);margin-bottom:10px}
details.dr{border-bottom:2px solid var(--line);padding:10px 0}details.dr summary{display:flex;justify-content:space-between;gap:8px;cursor:pointer;align-items:center}
.dr b{font-style:italic;font-size:1.05rem}.dr .f{color:var(--gd);font-size:.85rem;font-weight:900}.dr .d{font-size:.8rem;color:var(--y);letter-spacing:1px}.dr p{margin:6px 0;line-height:1.5;font-size:.95rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="view on" id="home"><div class="top" id="stats"></div><div class="pad"><div class="h1">Flora alemã</div><p class="sub">100 espécies · uma lição de 10 por vez</p><button class="rev" id="revb"></button><div class="path" id="path"></div></div></div>
<div class="view" id="dict"><div class="top" id="stats2"></div><div class="pad" style="padding-bottom:110px"><input id="search" type="search" placeholder="Buscar espécie, família, característica…"><div id="dl"></div></div></div>
<div class="view" id="lesson"><div class="lh"><button class="x" id="quit" aria-label="Sair">✕</button><div class="bar"><b id="pb"></b></div><div class="hp" id="hp"></div></div><div class="qa" id="qa"></div><div class="lf" id="foot"></div></div>
<div class="view" id="res"><div class="pad" style="text-align:center;padding-top:40px"><div style="font-size:4rem" id="rE"></div><div class="h1" id="rT"></div><p class="sub" id="rS"></p><div class="tiles" id="rTi"></div><div id="rL" style="text-align:left"></div><button class="btn" id="rB" style="margin:20px 0 40px">Continuar</button></div></div>
<nav class="nav" id="nav"><div><button data-v="home" class="on"><span>🌱</span>Aprender</button><button data-v="dict"><span>📖</span>Dicionário</button></div></nav>
<script>
const DATA=[{"n":1,"species":"Sambucus nigra","family":"Adoxaceae","exam":"Fruchttyp; Standort","diagnostic":"Arbusto; folhas opostas pinadas, flores brancas em corimbos, frutos negros. Fruto drupáceo; sebes e solos ricos.","memory":"Flores brancas em pratos, depois frutos negros.","genus":"Sambucus","common_de":"Schwarzer Holunder","common_pt":"Sabugueiro-negro"},{"n":2,"species":"Galanthus nivalis","family":"Amaryllidaceae","exam":"Fruchtknotenstellung; Speicherorgan","diagnostic":"Flor branca pendente, 3 tépalas externas longas e 3 internas menores. Ovário ínfero; bulbo.","memory":"Pequena flor branca de fim de inverno.","genus":"Galanthus","common_de":"Kleines Schneeglöckchen","common_pt":"Galanthus / campainha-de-inverno"},{"n":3,"species":"Allium ursinum","family":"Amaryllidaceae","exam":"Blütenstand; Fruchttyp","diagnostic":"Folhas largas com cheiro de alho; flores brancas em umbela; cápsula.","memory":"Cheiro de alho; cuidado com folhas parecidas de espécies tóxicas.","genus":"Allium","common_de":"Bärlauch","common_pt":"Alho-dos-ursos"},{"n":4,"species":"Daucus carota","family":"Apiaceae","exam":"Fruchttyp; Lebensalter","diagnostic":"Folhas divididas, umbela composta branca, frutos espinhosos. Esquizocarpo; geralmente bienal.","memory":"Umbela branca e frutos espinhosos.","genus":"Daucus","common_de":"Wilde Möhre","common_pt":"Cenoura-brava"},{"n":5,"species":"Heracleum sphondylium","family":"Apiaceae","exam":"Blütenstand; Fruchttyp","diagnostic":"Planta robusta, folhas grandes lobadas, umbelas compostas; fruto em dois mericarpos.","memory":"Uma Apiaceae grande e robusta.","genus":"Heracleum","common_de":"Wiesen-Bärenklau","common_pt":"Bérula / Heracleum-comum"},{"n":6,"species":"Arum maculatum","family":"Araceae","exam":"Blütenstand; Nervatur","diagnostic":"Espádice dentro de espata; folhas sagitadas, às vezes manchadas; nervação reticulada.","memory":"Uma tocha floral dentro de uma capa; tóxica.","genus":"Arum","common_de":"Gefleckter Aronstab","common_pt":"Jarro-dos-campos"},{"n":7,"species":"Hedera helix","family":"Araliaceae","exam":"Wuchsform; Fruchttyp","diagnostic":"Trepadeira lenhosa com raízes de fixação; folhas juvenis lobadas; frutos negros tipo drupa.","memory":"A hera muda a forma das folhas conforme o ramo.","genus":"Hedera","common_de":"Gemeiner Efeu","common_pt":"Hera-comum"},{"n":8,"species":"Convallaria majalis","family":"Asparagaceae","exam":"Blütenstand; Wuchs-/Lebensform","diagnostic":"Geralmente duas folhas basais; flores brancas pendentes em racemo unilateral; geófita rizomatosa.","memory":"Sininhos brancos num lado do eixo; tóxica.","genus":"Convallaria","common_de":"Maiglöckchen","common_pt":"Lírio-do-vale"},{"n":9,"species":"Achillea millefolium","family":"Asteraceae","exam":"Laubblattform; Blütenstand","diagnostic":"Folhas muito finamente divididas; capítulos brancos/rosados em corimbo.","memory":"“Mil-folhas” descreve a folhagem.","genus":"Achillea","common_de":"Gewöhnliche Schafgarbe","common_pt":"Milefólio / mil-folhas"},{"n":10,"species":"Artemisia vulgaris","family":"Asteraceae","exam":"Bestäubungstyp; Verwendung","diagnostic":"Folhas lobadas, face inferior clara; capítulos discretos. Predominantemente vento; uso tradicional aromático.","memory":"Folhagem recortada e face inferior clara.","genus":"Artemisia","common_de":"Gewöhnlicher Beifuß","common_pt":"Artemísia-comum"},{"n":11,"species":"Arctium lappa","family":"Asteraceae","exam":"Involukralblätter; Standort","diagnostic":"Folhas enormes cordadas; brácteas do capítulo com ganchos; locais perturbados ricos em nutrientes.","memory":"Carrapichos que grudam na roupa.","genus":"Arctium","common_de":"Große Klette","common_pt":"Bardana-maior"},{"n":12,"species":"Bellis perennis","family":"Asteraceae","exam":"Lebensform; Standort","diagnostic":"Roseta basal; centro amarelo e flores marginais brancas. Perene; relvados e prados cortados.","memory":"Margarida pequena de gramado.","genus":"Bellis","common_de":"Gänseblümchen","common_pt":"Margarida-comum"},{"n":13,"species":"Centaurea jacea","family":"Asteraceae","exam":"Blütendifferenzierung; Standort","diagnostic":"Capítulos púrpura; flores marginais vistosas; brácteas com apêndices castanhos; prados.","memory":"Botão púrpura sem lígulas longas.","genus":"Centaurea","common_de":"Wiesen-Flockenblume","common_pt":"Centáurea-dos-prados"},{"n":14,"species":"Cirsium vulgare","family":"Asteraceae","exam":"Laubblattform; Lebensalter","diagnostic":"Folhas profundamente lobadas e espinhosas; caule alado espinhoso; geralmente bienal.","memory":"Espinhos por toda a planta.","genus":"Cirsium","common_de":"Gewöhnliche Kratzdistel","common_pt":"Cardo-rasteiro"},{"n":15,"species":"Matricaria chamomilla","family":"Asteraceae","exam":"Standort; Inhaltsstoffe","diagnostic":"Folhas finas; capítulo branco/amarelo; receptáculo cônico oco. Solos agrícolas; óleo essencial com bisabolol/camazuleno.","memory":"Camomila verdadeira: receptáculo oco.","genus":"Matricaria","common_de":"Echte Kamille","common_pt":"Camomila-verdadeira"},{"n":16,"species":"Tanacetum vulgare","family":"Asteraceae","exam":"Blütentyp; Fruchttyp","diagnostic":"Folhas pinadas aromáticas; capítulos amarelos em botão sem lígulas; cipsela.","memory":"Muitos botões amarelos; cuidado com toxicidade.","genus":"Tanacetum","common_de":"Rainfarn","common_pt":"Tanaceto / erva-de-São-Marcos"},{"n":17,"species":"Taraxacum officinale s.l.","family":"Asteraceae","exam":"Laubblattform; Wurzeltyp","diagnostic":"Roseta de folhas lobadas; capítulo amarelo solitário em escapo oco; raiz pivotante.","memory":"Dente-de-leão e esfera branca de sementes.","genus":"Taraxacum","common_de":"Gewöhnlicher Löwenzahn","common_pt":"Dente-de-leão"},{"n":18,"species":"Tussilago farfara","family":"Asteraceae","exam":"Blütezeit; Verwendung","diagnostic":"Flores amarelas antes das folhas; folhas posteriores grandes e cordadas. Floração precoce; uso tradicional para tosse.","memory":"Primeiro a flor, depois a folha enorme.","genus":"Tussilago","common_de":"Huflattich","common_pt":"Unha-de-cavalo"},{"n":19,"species":"Impatiens parviflora","family":"Balsaminaceae","exam":"Lebensalter; Indigenat","diagnostic":"Flores amarelo-pálidas com esporão; cápsulas explosivas. Anual; neófito naturalizado.","memory":"A cápsula “impaciente” lança sementes.","genus":"Impatiens","common_de":"Kleines Springkraut","common_pt":"Impatiens-de-flor-pequena"},{"n":20,"species":"Berberis vulgaris","family":"Berberidaceae","exam":"Wuchsform; Blattgrund","diagnostic":"Arbusto espinhoso; folhas em fascículos; flores amarelas, frutos vermelhos.","memory":"Espinhos e bagas vermelhas.","genus":"Berberis","common_de":"Berberitze / Sauerdorn","common_pt":"Berberis / uva-espim"},{"n":21,"species":"Mahonia aquifolium","family":"Berberidaceae","exam":"Laubblattform; Indigenat","diagnostic":"Folhas compostas pinadas, folíolos coriáceos com margens espinhosas; espécie introduzida.","memory":"Parece azevinho, mas a folha é composta.","genus":"Mahonia","common_de":"Mahonie","common_pt":"Mahónia"},{"n":22,"species":"Alnus glutinosa","family":"Betulaceae","exam":"Standort; Geschlechtsverteilung","diagnostic":"Folhas arredondadas com ápice entalhado; cones lenhosos; zonas alagadas; monoica.","memory":"Amieiro de solos encharcados com cones.","genus":"Alnus","common_de":"Schwarzerle","common_pt":"Amieiro-negro"},{"n":23,"species":"Betula pendula","family":"Betulaceae","exam":"Blütenstand; Fruchttyp","diagnostic":"Casca branca descamante; folhas triangulares serradas; amentilhos; núculas aladas.","memory":"Tronco branco e sementes aladas.","genus":"Betula","common_de":"Hängebirke","common_pt":"Vidoeiro-pendente"},{"n":24,"species":"Carpinus betulus","family":"Betulaceae","exam":"Laubblattform; Fruchttyp","diagnostic":"Folhas com nervuras vincadas e margem duplamente serrada; fruto com bráctea trilobada.","memory":"Parece faia, mas tem nervuras e serras fortes.","genus":"Carpinus","common_de":"Hainbuche","common_pt":"Carpino-europeu"},{"n":25,"species parcialmente envolvida por arilo vermelho; taxanos/taxina; sementes e folhas tóxicas.","memory":"Arilo vermelho em taça; planta tóxica.","genus":"Taxus","common_de":"Europäische Eibe","common_pt":"Teixo-europeu"},{"n":98,"species":"Ulmus minor","family":"Ulmaceae","exam":"Bestäubungstyp; Fruchttyp","diagnostic":"Folhas alternas com base assimétrica e margem duplamente serrada; flores antes das folhas; vento; sâmara.","memory":"Base assimétrica e fruto alado.","genus":"Ulmus","common_de":"Feldulme","common_pt":"Ulmeiro-menor"},{"n":99,"species":"Urtica dioica","family":"Urticaceae","exam":"Geschlechtsverteilung; Standort","diagnostic":"Folhas opostas serradas com pelos urticantes; geralmente dioica; solos ricos em nitrogênio e locais perturbados.","memory":"Urtiga: folhas opostas e pelos que picam.","genus":"Urtica","common_de":"Große Brennnessel","common_pt":"Urtiga-maior"},{"n":100,"species":"Viola tricolor","family":"Violaceae","exam":"Fruchttyp; Lebensalter/Lebensform","diagnostic":"Flores com cinco pétalas multicoloridas e esporão curto; cápsula; anual ou bienal.","memory":"Amor-perfeito-silvestre: flor multicolorida e cápsula.","genus":"Viola","common_de":"Wildes Stiefmütterchen","common_pt":"Amor-perfeito-bravo"}];
const D=DATA.map(d=>({...d,sci:d.species.replace(' (Beispiel)','')}));
const fams=[...new Set(D.map(d=>d.family))],KEY='flora_v1';
let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
S.xp=S.xp||0;S.streak=S.streak||0;S.str=S.str||{};S.done=S.done||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const day=(d=new Date())=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const yest=()=>{const d=new Date();d.setDate(d.getDate()-1);return day(d)};
const streakNow=()=>S.last&&(S.last===day()||S.last===yest())?S.streak:0;
const LES=Array.from({length:Math.ceil(D.length/10)},(_,k)=>D.map((_,i)=>i).slice(k*10,k*10+10));
const mastery=k=>LES[k].reduce((a,i)=>a+(S.str[i]||0),0)/(LES[k].length*5)*100;
const knownN=()=>Object.values(S.str).filter(v=>v>=3).length;
let AC;function beep(f,t=.12,ty='sine'){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.1,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+t)}catch(e){}}
function show(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id===v));$('#nav').style.display=v==='home'||v==='dict'?'':'none';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));window.scrollTo(0,0);if(v==='home')home();if(v==='dict')dict()}
function statBar(){return`<span>🔥 ${streakNow()}</span><span>⚡ ${S.xp}</span><span>🌱 ${knownN()}/${D.length}</span>`}
function home(){$('#stats').innerHTML=statBar();
 const nextK=LES.findIndex((_,k)=>!S.done[k]),seen=Object.keys(S.str).map(Number);
 const rb=$('#revb');rb.disabled=seen.length<5;rb.innerHTML=`<span class="ic">💪</span><div><b>Praticar as mais fracas</b><small>${seen.length<5?'Complete uma lição para liberar':'10 espécies que você mais esquece'}</small></div>`;
 const off=[0,38,58,38,0,-38,-58,-38];
 $('#path').innerHTML=LES.map((ids,k)=>{const p=mastery(k),fl=[...new Set(ids.map(i=>D[i].family))],gold=p>=80;
  return`<div class="nodew" style="transform:translateX(${off[k%8]}px)">${k===nextK?'<div class="go">COMEÇAR</div>':''}<button class="node ${gold?'gold':''}" style="--p:${p|0}" data-k="${k}" aria-label="Lição ${k+1}"><i>${gold?'★':k+1}</i></button><div class="nl">${fl.slice(0,2).join(', ')}${fl.length>2?' +'+(fl.length-2):''}</div></div>`}).join('');
 document.querySelectorAll('.node').forEach(b=>b.onclick=()=>start(LES[b.dataset.k],+b.dataset.k))}
$('#revb').onclick=()=>{const w=Object.keys(S.str).map(Number).sort((a,b)=>S.str[a]-S.str[b]||Math.random()-.5).slice(0,10);start(w,-1)};
function dict(){$('#stats2').innerHTML=statBar();const q=$('#search').value.trim().toLowerCase();
 $('#dl').innerHTML=D.filter(d=>!q||Object.values(d).join(' ').toLowerCase().includes(q)).map(d=>{const s=S.str[D.indexOf(d)]||0;
  return`<details class="dr"><summary><div><b>${d.sci}</b><div class="f">${d.family}</div></div><span class="d">${'●'.repeat(s)}${'○'.repeat(5-s)}</span></summary><p>🇩🇪 ${d.common_de}<br>🇵🇹 ${d.common_pt}</p><p>💡 ${d.memory}</p><p>${d.diagnostic}</p><p style="color:var(--mut)">Na prova: ${d.exam.split(';').map(x=>x.trim()).join(' · ')}</p></details>`}).join('')||'<p class="sub">Nada encontrado.</p>'}
$('#search').oninput=dict;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
const IC=new Map();
function imgFor(d){if(IC.has(d.sci))return IC.get(d.sci);const g=d.sci.split(' ')[0].toLowerCase();
 const p=fetch('https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent('"'+d.sci+'"')+'&gsrnamespace=0&gsrlimit=5&prop=pageimages&piprop=thumbnail&pithumbsize=650&format=json&origin=*').then(r=>r.json()).then(j=>{const ps=Object.values(j.query?.pages||{}),pg=ps.find(x=>x.thumbnail&&x.title.toLowerCase().includes(g))||ps.find(x=>x.thumbnail),src=pg?.thumbnail?.source;if(!src)return null;return new Promise(r=>{const im=new Image();im.onload=()=>r(src);im.onerror=()=>r(null);im.src=src})}).catch(()=>null);
 const t=Promise.race([p,new Promise(r=>setTimeout(()=>r(null),6000))]);t.then(v=>{if(!v)IC.delete(d.sci)});IC.set(d.sci,t);return t}
function makeQ(i,retry){const d=D[i],s=S.str[i]||0,r=Math.random();
 const type=s===0?(r<.7?'photo':'de'):r<.35?'photo':r<.55?'de':r<.8?'fam':'diag';let ans,opts;
 if(type==='fam'){ans=d.family;opts=[ans,...shuf(fams.filter(f=>f!==ans)).slice(0,3)]}
 else{ans=d.sci;const same=shuf(D.filter(x=>x!==d&&x.family===d.family)).slice(0,2),rest=shuf(D.filter(x=>x!==d&&!same.includes(x)));opts=[ans,...same.concat(rest).slice(0,3).map(x=>x.sci)]}
 return{i,type,opts:shuf(opts),ans,retry}}
let L;
function start(ids,k){L={ids,k,queue:shuf(ids).map(i=>makeQ(i)),hearts:5,ok:0,miss:0,xp:0,got:new Set(),sel:null,checked:false};show('lesson');nextQ()}
function nextQ(){if(!L.queue.length)return finish(true);L.cur=L.queue.shift();renderQ();const n=L.queue[0];if(n&&n.type==='photo')imgFor(D[n.i])}
function head(){$('#pb').style.width=(L.got.size/L.ids.length*100)+'%';$('#hp').textContent='❤️ '+L.hearts}
async function renderQ(){const q=L.cur,d=D[q.i];L.sel=null;L.checked=false;head();foot();
 const qa=$('#qa'),sc=q.type!=='fam';let top='';
 if(q.type==='de')top=`<div class="q">Qual é o nome científico?</div><div class="big">🇩🇪 ${d.common_de}<small>🇵🇹 ${d.common_pt}</small></div>`;
 if(q.type==='fam')top=`<div class="q">A que família pertence?</div><div class="big sci">${d.sci}</div>`;
 if(q.type==='diag')top=`<div class="q">Quem é esta planta?</div><div class="bubble">${d.diagnostic}</div>`;
 if(q.type==='photo'){qa.innerHTML=`<div class="q">Que planta é esta?</div><div class="pic" id="pic">🌿</div>`;const src=await imgFor(d);if(L.cur!==q)return;if(!src){q.type='diag';return renderQ()}top=`<div class="q">Que planta é esta?</div><div class="pic"><img src="${src}" alt="Foto da planta"></div>`}
 qa.innerHTML=top+`<div class="opts">${q.opts.map((o,k)=>`<button class="opt ${sc?'i':''}" data-k="${k}"><kbd>${k+1}</kbd><span>${o}</span></button>`).join('')}</div>`;
 qa.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k))}
function pick(k){if(L.checked)return;L.sel=k;document.querySelectorAll('.opt').forEach((b,i)=>b.classList.toggle('sel',i===k));const c=$('#chk');if(c)c.disabled=false}
function foot(d,good){const f=$('#foot');if(!d){f.className='lf';f.innerHTML='<button class="btn" id="chk" disabled>Verificar</button>';$('#chk').onclick=check;return}
 f.className='lf '+(good?'ok':'bad');const w=['Correto!','Isso aí!','Perfeito!','Mandou bem!'];
 f.innerHTML=`<div class="fbh">${good?w[Math.random()*4|0]:'Resposta correta:'}</div><div class="sci">${d.sci}</div><div class="fam"><small>Família</small>${d.family}</div><div class="nm">🇩🇪 ${d.common_de} · 🇵🇹 ${d.common_pt}</div><div class="tip">💡 ${d.memory}</div><details><summary>Como reconhecer</summary><p>${d.diagnostic}</p><p>Na prova: ${d.exam.split(';').map(x=>x.trim()).join(' · ')}</p></details><button class="btn ${good?'':'red'}" id="cont">Continuar</button>`;
 $('#cont').onclick=cont;f.scrollTop=0}
function check(){if(L.sel==null||L.checked)return;L.checked=true;const q=L.cur,d=D[q.i],good=q.opts[L.sel]===q.ans;
 document.querySelectorAll('.opt').forEach((b,i)=>{b.classList.remove('sel');if(q.opts[i]===q.ans)b.classList.add('ok');else if(i===L.sel)b.classList.add('bad')});
 if(good){L.ok++;L.got.add(q.i);L.xp+=q.retry?5:10;if(!q.retry)S.str[q.i]=Math.min(5,(S.str[q.i]||0)+1);else S.str[q.i]=S.str[q.i]||0;beep(660);setTimeout(()=>beep(880),90)}
 else{L.miss++;L.hearts--;S.str[q.i]=Math.max(0,(S.str[q.i]||0)-1);L.queue.push(makeQ(q.i,true));beep(200,.25,'sawtooth')}
 save();head();foot(d,good)}
function cont(){if(L.hearts<=0)return finish(false);nextQ()}
function finish(win){const acc=L.ok+L.miss?Math.round(L.ok/(L.ok+L.miss)*100):0;
 if(win){if(!L.miss)L.xp+=10;S.xp+=L.xp;if(L.k>=0)S.done[L.k]=true;if(S.last!==day()){S.streak=S.last===yest()?S.streak+1:1;S.last=day()}}save();
 $('#rE').textContent=win?'🏆':'💔';$('#rT').textContent=win?'Lição completa!':'Sem corações';$('#rS').textContent=win?(L.miss?'Bom trabalho! Os erros voltam na revisão.':'Sem nenhum erro. Impecável!'):'Revise as espécies abaixo e tente de novo.';
 $('#rTi').innerHTML=`<div class="tile t1"><small>XP</small>⚡ ${win?L.xp:0}</div><div class="tile t2"><small>PRECISÃO</small>🎯 ${acc}%</div><div class="tile t3"><small>SEQUÊNCIA</small>🔥 ${streakNow()}</div>`;
 $('#rL').innerHTML=L.ids.map(i=>`<div class="rs"><i>${D[i].sci}</i><span>${D[i].family}</span></div>`).join('');show('res')}
$('#rB').onclick=()=>show('home');$('#quit').onclick=()=>{if(confirm('Sair da lição? O progresso desta lição será perdido.'))show('home')};
document.addEventListener('keydown',e=>{if(!$('#lesson').classList.contains('on'))return;if(e.key==='Enter'){e.preventDefault();L.checked?cont():check()}else if(/^[1-4]$/.test(e.key))pick(+e.key-1)});
show('home');
</script></body></html>
