<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flora — 100 Artenkenntnis</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#3c3c3c;--mut:#777;--line:#e5e5e5;--g:#58cc02;--gd:#58a700;--b:#1cb0f6;--bd:#1899d6;--r:#ff4b4b;--rd:#ea2b2b;--y:#ffc800;--yd:#e5b400;--okbg:#d7ffb8;--okink:#46a302;--badbg:#ffdfe0;--badink:#d33131;--sel:#ddf4ff;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#131f24;--ink:#e8eef0;--mut:#8fa3ad;--line:#37464f;--okbg:#1d3a0d;--okink:#8be04a;--badbg:#3d1618;--badink:#ff8a8a;--sel:#1a3a4a;--card:#1b2a31}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Varela Round",ui-rounded,system-ui,sans-serif;font-weight:700}
.view{display:none;max-width:560px;margin:0 auto}.view.on{display:block}
button{font:inherit;color:inherit}
.btn{border:0;border-radius:16px;padding:15px 20px;color:#fff;background:var(--g);box-shadow:0 4px 0 var(--gd);cursor:pointer;width:100%;font-weight:900;font-size:1rem;letter-spacing:.06em;text-transform:uppercase}
.btn:active{transform:translateY(4px);box-shadow:none}.btn.red{background:var(--r);box-shadow:0 4px 0 var(--rd)}.btn.blue{background:var(--b);box-shadow:0 4px 0 var(--bd)}
.btn:disabled{background:var(--line);color:var(--mut);box-shadow:none;cursor:default;transform:none}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.lang{font:inherit;font-weight:900;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:3px 4px}.top{gap:6px;position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-around;padding:12px 10px;border-bottom:2px solid var(--line);font-weight:900;font-size:1rem}
.top span:nth-child(1){color:#ff9600}.top span:nth-child(2){color:var(--yd)}.top span:nth-child(3){color:var(--gd)}
.pad{padding:16px 18px}.h1{font-size:1.6rem;font-weight:900;margin:6px 0 2px}.sub{color:var(--mut);margin:0 0 14px}
.rev{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;background:var(--card);padding:14px;cursor:pointer}
.rev:disabled{opacity:.55;cursor:default}.rev b{display:block;font-size:1.1rem;color:var(--b)}.rev small{color:var(--mut);font-weight:700}.rev .ic{font-size:2rem}
.path{display:flex;flex-direction:column;align-items:center;gap:26px;padding:26px 0 120px}
.nodew{display:flex;flex-direction:column;align-items:center;position:relative}
.node{--rc:var(--g);position:relative;width:104px;height:104px;border-radius:50%;border:0;padding:0;cursor:pointer;background:none;display:grid;place-items:center}.node::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--line) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px));mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px))}.node.m{--rc:var(--b)}.node.gold,.node.m.gold{--rc:var(--y)}
.node i{position:relative;margin-top:-3px;width:72px;height:72px;border-radius:50%;background:var(--g);box-shadow:0 6px 0 var(--gd);display:grid;place-items:center;font-style:normal;color:#fff;font-size:1.7rem;font-weight:900}
.node.gold i{background:var(--y);box-shadow:0 6px 0 var(--yd)}.node:active i{transform:translateY(5px);box-shadow:none}
.nl{margin-top:12px;font-size:.85rem;color:var(--mut);text-align:center;max-width:170px}
.go{position:absolute;top:-34px;background:var(--card);color:var(--gd);border:2px solid var(--line);border-radius:12px;padding:3px 10px;font-weight:900;font-size:.85rem;animation:fl 1.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-5px)}}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.nav div{max-width:560px;margin:auto;display:flex}.nav button{flex:1;background:none;border:0;padding:10px;font-weight:900;color:var(--mut);cursor:pointer;font-size:.95rem}.nav button.on{color:var(--b)}.nav span{display:block;font-size:1.5rem}
#lesson.on{display:flex;flex-direction:column;height:100dvh}
.lh{display:flex;align-items:center;gap:14px;padding:16px}.x{background:none;border:0;font-size:1.6rem;color:var(--mut);cursor:pointer}
.bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}.bar b{display:block;height:100%;width:0;background:var(--g);border-radius:99px;transition:width .35s;position:relative}
.bar b:after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:9px;background:#fff6}
.hp{color:var(--r);font-weight:900;font-size:1.15rem}
.qa{flex:1;overflow:auto;padding:6px 18px 20px;display:flex;flex-direction:column;gap:16px}
.q{font-size:1.45rem;font-weight:900}.big{font-size:1.5rem;font-weight:900;border:2px solid var(--line);border-radius:18px;padding:16px;background:var(--card)}.big small{display:block;color:var(--mut);font-size:1rem;margin-top:4px}
.big.sci,.big em{font-style:italic}.bubble{border:2px solid var(--line);border-radius:18px;padding:16px;font-weight:700;line-height:1.5;background:var(--card)}
.pic{flex:0 0 auto;width:min(100%,360px);max-width:360px;aspect-ratio:5/4;height:auto;min-height:0;margin:0 auto;border:2px solid var(--line);border-radius:18px;display:grid;place-items:center;overflow:hidden;background:var(--card);font-size:2.4rem}.pic img{display:block;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain;object-position:center;margin:auto}.pic.photo{background:#f5f7f2}.photo-credit{font-size:.72rem;color:var(--mut);font-weight:700;text-align:right;margin-top:-10px}.photo-credit a{color:var(--mut)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font-size:1.1rem;font-weight:800;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:13px 14px;cursor:pointer}
.opt kbd{font:inherit;font-size:.85rem;border:2px solid var(--line);border-radius:8px;min-width:28px;height:28px;display:grid;place-items:center;color:var(--mut)}
.opt.i span{font-style:italic}.opt.sel{border-color:var(--b);background:var(--sel);color:var(--b)}.opt.sel kbd{border-color:var(--b);color:var(--b)}
.opt.ok{border-color:var(--g);background:var(--okbg);color:var(--okink)}.opt.bad{border-color:var(--r);background:var(--badbg);color:var(--badink)}
.lf{padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:2px solid var(--line);max-height:58dvh;overflow:auto}
.lf.ok{background:var(--okbg);border-color:transparent;color:var(--okink)}.lf.bad{background:var(--badbg);border-color:transparent;color:var(--badink)}
.lf .btn{margin-top:12px}.fbh{font-weight:900;font-size:1.1rem}
.lf .sci{font-size:2rem;font-weight:900;font-style:italic;line-height:1.15;margin:4px 0;animation:pop .45s}
.lf .fam{display:inline-flex;align-items:center;gap:8px;background:hsl(var(--h,205) 62% 40%);color:#fff;border-radius:99px;padding:6px 16px;font-weight:900;font-size:1.15rem;margin:6px 0 10px;animation:pop .45s .08s both}
.fam small{font-size:.75rem;font-weight:800;opacity:.85}
.nm,.tip,.lf details{font-size:.98rem;line-height:1.5}.lf details{margin-top:6px}.lf summary{cursor:pointer;font-weight:900}.lf p{margin:6px 0}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.tile{border:2px solid;border-radius:16px;padding:10px 4px;text-align:center;font-weight:900}.tile small{display:block;font-size:.72rem;margin-bottom:4px;letter-spacing:.05em}
.t1{border-color:var(--yd);color:var(--yd)}.t2{border-color:var(--b);color:var(--b)}.t3{border-color:var(--g);color:var(--gd)}
.rs{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:2px solid var(--line)}.rs i{font-weight:900}.rs span{color:hsl(var(--h,205) 70% 36%);font-weight:800;font-size:.9rem}
#search{width:100%;font:inherit;font-weight:700;padding:13px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);margin-bottom:10px}
details.dr{border-bottom:2px solid var(--line);border-left:6px solid hsl(var(--h,205) 62% 45%);padding:10px 0 10px 12px}details.dr summary{display:flex;justify-content:space-between;gap:8px;cursor:pointer;align-items:center}
.dr b{font-style:italic;font-size:1.05rem}.dr .f{color:hsl(var(--h,205) 70% 36%);font-size:.85rem;font-weight:900}.dr .d{font-size:.8rem;color:var(--y);letter-spacing:1px}.dr p{margin:6px 0;line-height:1.5;font-size:.95rem}
.node.m i{background:var(--b);box-shadow:0 6px 0 var(--bd)}.node.m.gold i{background:var(--y);box-shadow:0 6px 0 var(--yd)}
.unit{align-self:stretch;background:var(--g);color:#fff;border-radius:16px;padding:12px 16px;font-weight:900;box-shadow:0 4px 0 var(--gd)}.unit.b{background:var(--b);box-shadow:0 4px 0 var(--bd)}.pic svg{width:100%;height:100%}
.modal{position:fixed;inset:0;background:#0009;display:grid;align-items:end;justify-items:center;z-index:20}.modal[hidden]{display:none}.mc{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:24px 18px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px}.mt{font-weight:900;font-size:1.25rem;text-align:center;margin-bottom:6px}.btn.out{background:var(--card);color:var(--rd);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
@media(prefers-color-scheme:dark){.dr .f,.rs span{color:hsl(var(--h,205) 75% 70%)}}
.dot{width:14px;height:14px;border-radius:50%;flex:none;background:hsl(var(--h,205) 62% 45%)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="view on" id="home"><div class="top" id="stats"></div><div class="pad"><div class="h1" data-t="title"></div><p class="sub" data-t="sub"></p><button class="rev" id="revb"></button><div class="path" id="path"></div></div></div>
<div class="view" id="dict"><div class="top" id="stats2"></div><div class="pad" style="padding-bottom:110px"><input id="search" type="search"><div id="dl"></div></div></div>
<div class="view" id="lesson"><div class="lh"><button class="x" id="quit" aria-label="Sair">✕</button><div class="bar"><b id="pb"></b></div><div class="hp" id="hp"></div></div><div class="qa" id="qa"></div><div class="lf" id="foot"></div></div>
<div class="view" id="res"><div class="pad" style="text-align:center;padding-top:40px"><div style="font-size:4rem" id="rE"></div><div class="h1" id="rT"></div><p class="sub" id="rS"></p><div class="tiles" id="rTi"></div><div id="rL" style="text-align:left"></div><button class="btn" id="rB" data-t="cont" style="margin:20px 0 40px"></button></div></div>
<div class="modal" id="qm" hidden role="dialog" aria-modal="true"><div class="mc"><div class="mt" data-t="quit"></div><button class="btn" id="qk" data-t="qk"></button><button class="btn out" id="qe" data-t="qe"></button></div></div>
<nav class="nav" id="nav"><div><button data-v="home" class="on"><span>🌱</span><i data-t="learn" style="font-style:normal"></i></button><button data-v="dict"><span>📖</span><i data-t="dict" style="font-style:normal"></i></button></div></nav>
<script>
const DATA=[{"n":1,"species":"Sambucus nigra","family":"Adoxaceae","exam":"Fruchttyp; Standort","diagnostic":"Arbusto; folhas opostas pinadas, flores brancas em corimbos, frutos negros. Fruto drupáceo; sebes e solos ricos.","memory":"Flores brancas em pratos, depois frutos negros.","genus":"Sambucus","common_de":"Schwarzer Holunder","common_pt":"Sabugueiro-negro"},{"n":2,"species":"Galanthus nivalis","family":"Amaryllidaceae","exam":"Fruchtknotenstellung; Speicherorgan","diagnostic":"Flor branca pendente, 3 tépalas externas longas e 3 internas menores. Ovário ínfero; bulbo.","memory":"Pequena flor branca de fim de inverno.","genus":"Galanthus","common_de":"Kleines Schneeglöckchen","common_pt":"Galanthus / campainha-de-inverno"},{"n":3,"species":"Allium ursinum","family":"Amaryllidaceae","exam":"Blütenstand; Fruchttyp","diagnostic":"Folhas largas com cheiro de alho; flores brancas em umbela; cápsula.","memory":"Cheiro de alho; cuidado com folhas parecidas de espécies tóxicas.","genus":"Allium","common_de":"Bärlauch","common_pt":"Alho-dos-ursos"},{"n":4,"species":"Daucus carota","family":"Apiaceae","exam":"Fruchttyp; Lebensalter","diagnostic":"Folhas divididas, umbela composta branca, frutos espinhosos. Esquizocarpo; geralmente bienal.","memory":"Umbela branca e frutos espinhosos.","genus":"Daucus","common_de":"Wilde Möhre","common_pt":"Cenoura-brava"},{"n":5,"species":"Heracleum sphondylium","family":"Apiaceae","exam":"Blütenstand; Fruchttyp","diagnostic":"Planta robusta, folhas grandes lobadas, umbelas compostas; fruto em dois mericarpos.","memory":"Uma Apiaceae grande e robusta.","genus":"Heracleum","common_de":"Wiesen-Bärenklau","common_pt":"Bérula / Heracleum-comum"},{"n":6,"species":"Arum maculatum","family":"Araceae","exam":"Blütenstand; Nervatur","diagnostic":"Espádice dentro de espata; folhas sagitadas, às vezes manchadas; nervação reticulada.","memory":"Uma tocha floral dentro de uma capa; tóxica.","genus":"Arum","common_de":"Gefleckter Aronstab","common_pt":"Jarro-dos-campos"},{"n":7,"species":"Hedera helix","family":"Araliaceae","exam":"Wuchsform; Fruchttyp","diagnostic":"Trepadeira lenhosa com raízes de fixação; folhas juvenis lobadas; frutos negros tipo drupa.","memory":"A hera muda a forma das folhas conforme o ramo.","genus":"Hedera","common_de":"Gemeiner Efeu","common_pt":"Hera-comum"},{"n":8,"species":"Convallaria majalis","family":"Asparagaceae","exam":"Blütenstand; Wuchs-/Lebensform","diagnostic":"Geralmente duas folhas basais; flores brancas pendentes em racemo unilateral; geófita rizomatosa.","memory":"Sininhos brancos num lado do eixo; tóxica.","genus":"Convallaria","common_de":"Maiglöckchen","common_pt":"Lírio-do-vale"},{"n":9,"species":"Achillea millefolium","family":"Asteraceae","exam":"Laubblattform; Blütenstand","diagnostic":"Folhas muito finamente divididas; capítulos brancos/rosados em corimbo.","memory":"“Mil-folhas” descreve a folhagem.","genus":"Achillea","common_de":"Gewöhnliche Schafgarbe","common_pt":"Milefólio / mil-folhas"},{"n":10,"species":"Artemisia vulgaris","family":"Asteraceae","exam":"Bestäubungstyp; Verwendung","diagnostic":"Folhas lobadas, face inferior clara; capítulos discretos. Predominantemente vento; uso tradicional aromático.","memory":"Folhagem recortada e face inferior clara.","genus":"Artemisia","common_de":"Gewöhnlicher Beifuß","common_pt":"Artemísia-comum"},{"n":11,"species":"Arctium lappa","family":"Asteraceae","exam":"Involukralblätter; Standort","diagnostic":"Folhas enormes cordadas; brácteas do capítulo com ganchos; locais perturbados ricos em nutrientes.","memory":"Carrapichos que grudam na roupa.","genus":"Arctium","common_de":"Große Klette","common_pt":"Bardana-maior"},{"n":12,"species":"Bellis perennis","family":"Asteraceae","exam":"Lebensform; Standort","diagnostic":"Roseta basal; centro amarelo e flores marginais brancas. Perene; relvados e prados cortados.","memory":"Margarida pequena de gramado.","genus":"Bellis","common_de":"Gänseblümchen","common_pt":"Margarida-comum"},{"n":13,"species":"Centaurea jacea","family":"Asteraceae","exam":"Blütendifferenzierung; Standort","diagnostic":"Capítulos púrpura; flores marginais vistosas; brácteas com apêndices castanhos; prados.","memory":"Botão púrpura sem lígulas longas.","genus":"Centaurea","common_de":"Wiesen-Flockenblume","common_pt":"Centáurea-dos-prados"},{"n":14,"species":"Cirsium vulgare","family":"Asteraceae","exam":"Laubblattform; Lebensalter","diagnostic":"Folhas profundamente lobadas e espinhosas; caule alado espinhoso; geralmente bienal.","memory":"Espinhos por toda a planta.","genus":"Cirsium","common_de":"Gewöhnliche Kratzdistel","common_pt":"Cardo-rasteiro"},{"n":15,"species":"Matricaria chamomilla","family":"Asteraceae","exam":"Standort; Inhaltsstoffe","diagnostic":"Folhas finas; capítulo branco/amarelo; receptáculo cônico oco. Solos agrícolas; óleo essencial com bisabolol/camazuleno.","memory":"Camomila verdadeira: receptáculo oco.","genus":"Matricaria","common_de":"Echte Kamille","common_pt":"Camomila-verdadeira"},{"n":16,"species":"Tanacetum vulgare","family":"Asteraceae","exam":"Blütentyp; Fruchttyp","diagnostic":"Folhas pinadas aromáticas; capítulos amarelos em botão sem lígulas; cipsela.","memory":"Muitos botões amarelos; cuidado com toxicidade.","genus":"Tanacetum","common_de":"Rainfarn","common_pt":"Tanaceto / erva-de-São-Marcos"},{"n":17,"species":"Taraxacum officinale s.l.","family":"Asteraceae","exam":"Laubblattform; Wurzeltyp","diagnostic":"Roseta de folhas lobadas; capítulo amarelo solitário em escapo oco; raiz pivotante.","memory":"Dente-de-leão e esfera branca de sementes.","genus":"Taraxacum","common_de":"Gewöhnlicher Löwenzahn","common_pt":"Dente-de-leão"},{"n":18,"species":"Tussilago farfara","family":"Asteraceae","exam":"Blütezeit; Verwendung","diagnostic":"Flores amarelas antes das folhas; folhas posteriores grandes e cordadas. Floração precoce; uso tradicional para tosse.","memory":"Primeiro a flor, depois a folha enorme.","genus":"Tussilago", const fmtTip=t=>t.replace(/\b([A-Z][a-z]+)( [a-z]{3,})?/g,(m,g,e)=>{if(!GEN[g])return m;if(e&&SCI.has(g+e))return`<i>${g+e}</i> [${GEN[g]}]`;return`<i>${g}</i> [${GEN[g]}]${e||''}`});

const morphNode=()=>{const first=MLES.findIndex((_,k)=>!S.done['m'+k]);return`<div class="unit b">${t('u2')}</div>`+MLES.map((ids,k)=>{const p=ids.reduce((a,i)=>a+(S.ms[i]||0),0)/(ids.length*5)*100,gold=p>=80;return`<div class="nodew" style="transform:translateX(${[0,40,0,-40][k]}px)">${k===first?`<div class="go">${t('new')}</div>`:''}<button class="node m ${gold?'gold':''}" style="--p:${p|0}" data-m="${k}" aria-label="${t(MN[k])}"><i>${gold?'★':['🌸','🍃','✂️','💐'][k]}</i></button><div class="nl">${t(MN[k])}</div></div>`}).join('')+`<div class="unit b">${t('u3')}</div><div class="nodew" style="transform:translateX(0px)"><button class="node m ${((FC.length&&FC.every((_,i)=>(S.cs[i]||0)>=3))?'gold':'')}" style="--p:${Math.round(FC.reduce((a,_,i)=>a+Math.min(5,S.cs[i]||0),0)/(FC.length*5)*100)}" data-c="1" aria-label="${t('u3')}"><i>🧩</i></button><div class="nl">${t('u3')}</div></div>`};

 {f:'Asteraceae',features:[27,6],why:['Capítulo + roseta basal','Köpfchen + grundständige Blätter','Flower head + basal rosette']},

 {f:'Fabaceae',features:[15,14],why:['Folha trifoliolada + folha pinada','Dreizähliges + gefiedertes Blatt','Trifoliate + pinnately compound leaves']},
 {f:'Lamiaceae',features:[4,9],why:['Folhas opostas + folha cordada','Gegenständige Blätter + herzförmiges Blatt','Opposite leaves + heart-shaped leaf']},

 {f:'Ranunculaceae',features:[0,21],why:['Ovário súpero + margem lobada','Oberständiger Fruchtknoten + gelappter Rand','Superior ovary + lobed margin']},
 {f:'Caprifoliaceae',features:[26,4],why:['Panícula + folhas opostas','Rispe + gegenständige Blätter','Panicle + opposite leaves']}
];
// Manually curated observations selected by the instructor. Each number maps to the exact iNaturalist observation chosen for that species.
const SELECTED_OBSERVATIONS = {"1":407764491,"2":390334698,"3":401282966,"4":406913950,"5":397858400,"6":386076781,"7":401061579,"8":408024932,"9":406978779,"10":406166426,"11":391194218,"12":402858342,"13":406605802,"14":407413471,"15":398784517,"16":407946449,"17":407030292,"18":406878042,"19":407367193,"20":406359843,"21":407357126,"22":406207412,"23":403031046,"24":402973036,"25":405191334,"26":407062864,"27":382992576,"28":370266652,"29":407611459,"30":400476829,"31":400709292,"32":407625815,"33":404318172,"34":384357039,"35":393663612,"36":406978830,"37":399454964,"38":405371922,"39":404702790,"40":362129343,"41":399483263,"42":407275286,"43":403677668,"44":407025403,"45":401946517,"46":406734927,"47":402963391,"48":406583198,"49":391887926,"50":406635968,"51":407562031,"52":407233687,"53":406398668,"54":408003901,"55":397560872,"56":157770017,"57":344737949,"58":407774329,"59":405242069,"60":201415105,"61":401208337,"62":407018881,"63":407992610,"64":405868246,"65":384488823,"66":404244426,"67":407376408,"68":407764801,"69":405069171,"70":408025228,"71":304477127,"72":399311222,"73":405026551,"74":406010320,"75":403226890,"76":406018705,"77":382705237,"78":406742429,"79":401679569,"80":405824982,"81":395020268,"82":407764700,"83":406138293,"84":406978829,"85":406129027,"86":401581896,"87":407780237,"88":406322876,"89":404728632,"90":399168030,"91":407056920,"92":408059945,"93":407577363,"94":407617775,"95":404686490,"96":403678842,"97":407206098,"98":405300357,"99":407072288,"100":394758026};
const IC=new Map();
async function imgFor(d){
 if(IC.has(d.n))return IC.get(d.n);
 const clean=d.sci.replace(/\s*\(Beispiel\)/ig,'').replace(/\s+s\.l\.$/i,'').trim();
 const p=(async()=>{
  const usablePhoto=async(photo,obs)=>{
   let src=photo?.url||'';if(!src)return null;
   src=src.replace('/square.','/large.').replace('/small.','/large.').replace('/medium.','/large.');
   const ok=await new Promise(resolve=>{const im=new Image();im.onload=()=>resolve(true);im.onerror=()=>resolve(false);im.src=src});
   return ok?{src,credit:obs?.user?.login||'',license:photo?.license_code||'',url:obs?.id?'https://www.inaturalist.org/observations/'+obs.id:''}:null;
  };
  // First try the instructor-selected observation and test each attached photo.
  try{
   const selectedId=SELECTED_OBSERVATIONS[String(d.n)];
   if(selectedId){
    const res=await fetch('https://api.inaturalist.org/v1/observations/'+selectedId);
    if(res.ok){const data=await res.json();const obs=Array.isArray(data.results)?data.results[0]:(data&&data.id?data:null);
     for(const photo of (obs?.photos||[])){const result=await usablePhoto(photo,obs);if(result)return result;}
    }
   }
  }catch(e){}
  // If the selected observation is temporarily unavailable or has no usable image,
  // fall back to the previous working taxon-based iNaturalist search.
  try{
   const params=new URLSearchParams({taxon_name:clean,quality_grade:'research',photos:'true',order_by:'votes',order:'desc',per_page:'30',photo_license:'CC-BY,CC-BY-SA,CC-BY-NC,CC-BY-NC-SA'});
   const res=await fetch('https://api.inaturalist.org/v1/observations?'+params.toString());
   if(res.ok){const data=await res.json();const rows=(data.results||[]).filter(o=>o.photos&&o.photos.length);
    rows.sort((a,b)=>Number((b.taxon?.name||'').toLowerCase()===clean.toLowerCase())-Number((a.taxon?.name||'').toLowerCase()===clean.toLowerCase()));
    for(const obs of rows){for(const photo of (obs.photos||[])){
     if(photo.license_code&&!['cc-by','cc-by-sa','cc-by-nc','cc-by-nc-sa','cc0'].includes(photo.license_code))continue;
     const result=await usablePhoto(photo,obs);if(result)return result;
    }}
   }
  }catch(e){}
  return null;
 })();
 IC.set(d.n,p);const result=await p;if(!result)IC.delete(d.n);return result;
}
function makeQ(i,retry,m,slot){if(m===2){const c=FC[i];return{i,type:'combo',opts:shuf([c.f,...shuf(fams.filter(f=>f!==c.f)).slice(0,3)]),ans:c.f,retry}}if(m===1){const mm=MORPH[i];return{i,type:'morph',opts:shuf([ml(mm),...shuf(MORPH.filter(x=>x.g===mm.g&&x!==mm)).slice(0,3).map(ml)]),ans:ml(mm),retry}}const d=D[i],s=S.str[i]||0,r=Math.random();
 // Guarantee a mix of question formats within every species lesson; retries can vary normally.
 const type=slot!==undefined?['photo','de','fam','diag'][slot%4]:(s===0?(r<.7?'photo':'de'):r<.35?'photo':r<.55?'de':r<.8?'fam':'diag');let ans,opts;
 if(type==='fam'){ans=d.family;opts=[ans,...shuf(fams.filter(f=>f!==ans)).slice(0,3)]}
 else{ans=d.sci;const same=shuf(D.filter(x=>x!==d&&x.family===d.family)).slice(0,2),rest=shuf(D.filter(x=>x!==d&&!same.includes(x)));opts=[ans,...same.concat(rest).slice(0,3).map(x=>x.sci)]}
 return{i,type,opts:shuf(opts),ans,retry}}
let L;
function start(ids,k,m){L={ids,k,m,queue:shuf(ids).map((i,slot)=>makeQ(i,0,m,slot)),hearts:5,ok:0,miss:0,xp:0,got:new Set(),sel:null,checked:false};show('lesson');nextQ()}
function nextQ(){if(!L.queue.length)return finish(true);L.cur=L.queue.shift();renderQ();const n=L.queue[0];if(n&&n.type==='photo')imgFor(D[n.i])}
function head(){$('#pb').style.width=(L.got.size/L.ids.length*100)+'%';$('#hp').textContent='❤️ '+L.hearts}
async function renderQ(){const q=L.cur,d=D[q.i];L.sel=null;L.checked=false;head();foot();
 const qa=$('#qa'),sc=q.type!=='fam';let top='';
 if(q.type==='morph'){const m=MORPH[q.i];top=`<div class="q">${QM[m.g][LI[LANG]]}</div><div class="pic">${m.svg()}</div>`}
 if(q.type==='combo'){const c=FC[q.i];top=`<div class="q">${t('qcombo')}</div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">${c.features.map(i=>`<div class="bubble" style="padding:8px;text-align:center"><div class="pic" style="height:145px;border:0">${MORPH[i].svg()}</div><small>${MORPH[i].n[LI[LANG]]}</small></div>`).join('')}</div>`}
 if(q.type==='de')top=`<div class="q">${t('qd')}</div><div class="big">🇩🇪 ${d.common_de}${LANG==='de'?'':`<small>${FL[LANG]} ${d['common_'+LANG]}</small>`}</div>`;
 if(q.type==='fam')top=`<div class="q">${t('qf')}</div><div class="big sci">${d.sci}</div>`;
 if(q.type==='diag')top=`<div class="q">${t('qg')}</div><div class="bubble">${d.diag[LANG]}</div>`;
 if(q.type==='photo'){qa.innerHTML=`<div class="q">${t('qp')}</div><div class="pic" id="pic">🌿</div>`;const photo=await imgFor(d);if(L.cur!==q)return;if(!photo){
 // Keep the scientific-name question coherent if no photograph can be retrieved.
 q.type='de';q.ans=d.sci;const alternatives=shuf(D.filter(x=>x!==d&&x.sci!==d.sci)).slice(0,3).map(x=>x.sci);q.opts=shuf([q.ans,...alternatives]);return renderQ()
 }const src=typeof photo==='string'?photo:photo.src;const credit=typeof photo==='object'&&photo.credit?` · © ${photo.credit}`:'';const link=typeof photo==='object'&&photo.url?photo.url:'';top=`<div class="q">${t('qp')}</div><div class="pic photo"><img src="${src}" alt="${t('alt')}" loading="eager"></div>${link?`<div class="photo-credit"><a href="${link}" target="_blank" rel="noopener noreferrer">iNaturalist observation${credit}</a>${photo.license?` · ${photo.license}`:''}</div>`:''}`}
 qa.innerHTML=top+`<div class="opts">${q.opts.map((o,k)=>`<button class="opt ${sc?'i':''}" data-k="${k}"><kbd>${k+1}</kbd>${sc?'':`<b class="dot" style="--h:${hh(o)}"></b>`}<span>${o}</span></button>`).join('')}</div>`;
 qa.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k))}
function pick(k){if(L.checked)return;L.sel=k;document.querySelectorAll('.opt').forEach((b,i)=>b.classList.toggle('sel',i===k));const c=$('#chk');if(c)c.disabled=false}
function foot(d,good){const f=$('#foot');if(!d){f.className='lf';f.innerHTML='<button class="btn" id="chk" disabled>'+t('check')+'</button>';$('#chk').onclick=check;return}
 f.className='lf '+(good?'ok':'bad');const w=t('good');
 f.innerHTML=`<div class="fbh">${good?w[Math.random()*4|0]:t('right')}</div><div class="sci">${d.sci}</div><div class="fam" style="--h:${hh(d.family)}"><small>${d.pl||t('fam')}</small>${d.family}</div><div class="nm">${d.nm??names(d)}</div>${d.tipAll||LANG==='pt'?`<div class="tip">💡 ${d.memory}</div>`:''}${d.diag?`<details><summary>${t('how')}</summary><p>${d.diag[LANG]}</p></details>`:''}<button class="btn ${good?'':'red'}" id="cont">${t('cont')}</button>`;
 $('#cont').onclick=cont;f.scrollTop=0}
function check(){if(L.sel==null||L.checked)return;L.checked=true;const q=L.cur,C=L.m===2,M=q.type==='morph',d=C?{sci:FC[q.i].f,pl:t('fam'),family:FC[q.i].f,memory:FC[q.i].why[LI[LANG]],tipAll:1,nm:''}:M?MDf(q.i):D[q.i],T=C?S.cs:M?S.ms:S.str,good=q.opts[L.sel]===q.ans;
 document.querySelectorAll('.opt').forEach((b,i)=>{b.classList.remove('sel');if(q.opts[i]===q.ans)b.classList.add('ok');else if(i===L.sel)b.classList.add('bad')});
 if(good){L.ok++;L.got.add(q.i);L.xp+=q.retry?5:10;if(!q.retry)T[q.i]=Math.min(5,(T[q.i]||0)+1);else T[q.i]=T[q.i]||0;beep(660);setTimeout(()=>beep(880),90)}
 else{L.miss++;L.hearts--;T[q.i]=Math.max(0,(T[q.i]||0)-1);L.queue.push(makeQ(q.i,true,L.m));beep(200,.25,'sawtooth')}
 save();head();foot(d,good)}
function cont(){if(L.hearts<=0)return finish(false);nextQ()}
function finish(win){const acc=L.ok+L.miss?Math.round(L.ok/(L.ok+L.miss)*100):0;
 if(win){if(!L.miss)L.xp+=10;S.xp+=L.xp;if(L.k!==-1)S.done[L.k]=true;if(S.last!==day()){S.streak=S.last===yest()?S.streak+1:1;S.last=day()}}save();
 $('#rE').textContent=win?'🏆':'💔';$('#rT').textContent=win?t('done'):t('noh');$('#rS').textContent=win?(L.miss?t('ok1'):t('ok0')):t('fail');
 $('#rTi').innerHTML=`<div class="tile t1"><small>XP</small>⚡ ${win?L.xp:0}</div><div class="tile t2"><small>${t('acc')}</small>🎯 ${acc}%</div><div class="tile t3"><small>${t('strk')}</small>🔥 ${streakNow()}</div>`;
 $('#rL').innerHTML=L.ids.map(i=>{const d=L.m===2?{sci:FC[i].f,family:FC[i].f}:L.m===1?MDf(i):D[i];return`<div class="rs"><i>${d.sci}</i><span style="--h:${hh(d.family)}">${d.family}</span></div>`}).join('');show('res')}
$('#rB').onclick=()=>show('home');$('#quit').onclick=()=>{$('#qm').hidden=false;$('#qk').focus()};$('#qk').onclick=()=>{$('#qm').hidden=true};$('#qe').onclick=()=>{$('#qm').hidden=true;show('home')};
document.addEventListener('keydown',e=>{if(!$('#lesson').classList.contains('on'))return;if(!$('#qm').hidden){if(e.key==='Escape')$('#qm').hidden=true;return}if(e.key==='Enter'){e.preventDefault();L.checked?cont():check()}else if(/^[1-4]$/.test(e.key))pick(+e.key-1)});
applyLang();show('home');
